[project]
name = "inspection-demo-hf"
version = "1.0.0"
description = "Private Hugging Face Ecore inspection grounding and navigation demo"
requires-python = ">=3.12,<3.13"
dependencies = [
  "baml-py==0.222.0",
  "fastapi==0.141.1",
  "httpx==0.28.1",
  "huggingface-hub==0.36.0",
  "ifcopenshell==0.8.4.post1",
  "loguru==0.7.3",
  "numpy==2.3.3",
  "openai==3.5.0",
  "pydantic==2.12.5",
  "pydantic-settings==2.12.0",
  "python-dotenv==1.2.3",
  "rank-bm25==0.2.2",
  "requests==2.34.2",
  "scipy==1.18.1",
  "sqlalchemy==2.0.52",
  "sqlmodel==0.0.40",
  "tiktoken==0.14.0",
  "torch==2.10.0",
  "tqdm==4.70.0",
  "typing-extensions==4.16.0",
  "uvicorn[standard]==0.52.0",
]

[project.optional-dependencies]
dev = [
  "playwright>=1.55,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.9,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/inspection_demo"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-q"
pythonpath = ["backend"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.fastapi]
entrypoint = "inspection_demo.main:app"

[tool.uv.sources]
torch = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
  { index = "pytorch-cpu", marker = "sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
