[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tog-ifc"
version = "0.2.1"
description = "Provider-independent Think-on-Graph implementation for reproducible IFC reasoning"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "ifcopenshell==0.8.4.post1",
  "numpy>=2.3.3,<2.5",
  "pydantic==2.12.5",
  "rank-bm25==0.2.2",
]

[project.urls]
Upstream = "https://github.com/DataArcTech/ToG"
Original = "https://github.com/GasolSun36/ToG"

[project.optional-dependencies]
dev = [
  "pytest==9.0.2",
]

[project.scripts]
tog-ifc = "tog.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
tog = ["py.typed"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.12"
follow_imports = "skip"
ignore_missing_imports = true

[tool.uv]
constraint-dependencies = [
  "annotated-types==0.7.0",
  "iniconfig==2.3.0",
  "isodate==0.7.2",
  "lark==1.3.1",
  "packaging==25.0",
  "pluggy==1.6.0",
  "pydantic-core==2.41.5",
  "pygments==2.19.2",
  "python-dateutil==2.9.0.post0",
  "shapely==2.1.2",
  "six==1.17.0",
  "typing-extensions==4.15.0",
  "typing-inspection==0.4.2",
]
